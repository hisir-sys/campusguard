name: CampusGuard Phase 3-4 Validation

on:
  push:
    branches:
      - phase-3-4
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU AI runtime and test tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt pytest

      - name: Compile all application and test modules
        shell: pwsh
        run: python -m compileall -q campusguard main.py tests scripts

      - name: Diagnose server client and viewer tests independently
        shell: pwsh
        continue-on-error: true
        run: python -m pytest tests/test_server_client.py tests/test_server_viewer.py -vv -ra --tb=long

      - name: Run the complete test suite
        shell: pwsh
        run: python -m pytest -ra --tb=long

      - name: Render viewer in dark/light themes and 0/5/120-camera layouts
        shell: pwsh
        run: python scripts/render_server_viewer.py --output artifacts/ui-renders

      - name: Install Windows packaging tools
        shell: pwsh
        run: |
          python -m pip install pyinstaller pillow
          python scripts/generate_app_icon.py
          if (-not (Test-Path "models")) { New-Item -ItemType Directory -Force models | Out-Null }
          python -m PyInstaller --noconfirm --clean CampusGuard.spec

      - name: Build dedicated school-server installer
        shell: pwsh
        env:
          APP_VERSION: ${{ github.run_number }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup was not found." }
          & $iscc "/DAppVersion=0.$env:APP_VERSION" "installer\CampusGuardServer.iss"
          if ($LASTEXITCODE -ne 0) { throw "CampusGuard Server installer compilation failed." }
          $installer = "dist\CampusGuard-Server-Setup.exe"
          if (-not (Test-Path $installer)) { throw "CampusGuard-Server-Setup.exe was not produced." }
          $size = (Get-Item $installer).Length
          Write-Host "CampusGuard Server installer size: $size bytes"
          if ($size -lt 1000000) { throw "Server installer is unexpectedly small." }
          (Get-FileHash $installer -Algorithm SHA256).Hash | Set-Content "dist\CampusGuard-Server-Setup.sha256"

      - name: Upload server installer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CampusGuard-Server-Installer
          path: |
            dist/CampusGuard-Server-Setup.exe
            dist/CampusGuard-Server-Setup.sha256
          if-no-files-found: warn

      - name: Upload UI render screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CampusGuard-Phase-3-4-UI-Renders
          path: artifacts/ui-renders/*.png
          if-no-files-found: warn
