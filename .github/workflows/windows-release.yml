name: CampusGuard Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: campusguard-windows-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # CPU-only PyTorch: the CUDA builds are several times larger and CampusGuard runs on CPU.
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -c "import torch; print('torch', torch.__version__); assert torch.version.cuda is None, 'CUDA build of torch installed'"
          python -m pip install pyinstaller pillow

      - name: Prepare YOLO runtime weights
        shell: pwsh
        run: |
          python -c "from ultralytics import YOLO; YOLO('yolo11n.pt'); YOLO('yolo11n-pose.pt')"
          New-Item -ItemType Directory -Force models | Out-Null
          Copy-Item yolo11n.pt models/yolo11n.pt -Force
          Copy-Item yolo11n-pose.pt models/yolo11n-pose.pt -Force

      - name: Prepare release number
        shell: pwsh
        env:
          CAMPUSGUARD_VERSION: ${{ github.run_number }}
        run: |
          Set-Content version.txt $env:CAMPUSGUARD_VERSION
          # Bake the number into the app: the frozen exe cannot see build-time env vars,
          # and without it the updater would treat every build as "dev".
          Set-Content -Path campusguard/_build_version.py -Value "VERSION = '$env:CAMPUSGUARD_VERSION'" -Encoding ascii

      - name: Generate application icon
        shell: pwsh
        run: python scripts/generate_app_icon.py

      - name: Build CampusGuard.exe
        shell: pwsh
        env:
          CAMPUSGUARD_VERSION: ${{ github.run_number }}
        run: |
          python -m PyInstaller --noconfirm --clean CampusGuard.spec

      - name: Verify application folder
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\CampusGuard\CampusGuard.exe")) { throw "CampusGuard.exe was not produced." }
          $size = (Get-Item "dist\CampusGuard\CampusGuard.exe").Length
          Write-Host "CampusGuard.exe size: $size bytes"
          if ($size -lt 100000) { throw "Executable is unexpectedly small." }
          if (-not (Get-ChildItem "dist\CampusGuard" -Recurse -Filter "dm-sans-400.ttf")) { throw "Bundled fonts are missing." }

      - name: Report application size
        shell: pwsh
        run: |
          # Informational only: never fails the build.
          try {
            $root = (Resolve-Path "dist\CampusGuard").Path
            $files = Get-ChildItem $root -Recurse -File
            Write-Host ("Total: {0:N0} MB in {1} files" -f (($files | Measure-Object Length -Sum).Sum / 1MB), $files.Count)
            foreach ($base in @($root, (Join-Path $root "_internal"))) {
              if (-not (Test-Path $base)) { continue }
              Write-Host "--- folders in $base (MB) ---"
              Get-ChildItem $base -Directory | ForEach-Object {
                $sum = (Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum
                [pscustomobject]@{ Folder = $_.Name; MB = [math]::Round($sum / 1MB, 1) }
              } | Sort-Object MB -Descending | Select-Object -First 15 | Format-Table -AutoSize | Out-String | Write-Host
            }
            Write-Host "--- 25 largest files (MB) ---"
            $files | Sort-Object Length -Descending | Select-Object -First 25 | ForEach-Object {
              "{0,8:N1}  {1}" -f ($_.Length / 1MB), $_.FullName.Substring($root.Length)
            } | Write-Host
          } catch {
            Write-Host "Size report failed: $_"
          }

      - name: Smoke-test the built app
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selfcheck.txt"
          Remove-Item $out -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "dist\CampusGuard\CampusGuard.exe" -ArgumentList "--self-check", "`"$out`"" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "Self-check timed out." }
          if (Test-Path $out) { Get-Content $out | Write-Host } else { Write-Host "No self-check output was written." }
          if (-not (Test-Path $out) -or -not ((Get-Content $out -Raw).StartsWith("OK"))) { throw "Built app failed its self-check." }

      - name: Build installer
        shell: pwsh
        env:
          CAMPUSGUARD_VERSION: ${{ github.run_number }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup was not found." }
          & $iscc "/DAppVersion=$env:CAMPUSGUARD_VERSION" "installer\CampusGuard.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }
          if (-not (Test-Path "dist\CampusGuard-Setup.exe")) { throw "CampusGuard-Setup.exe was not produced." }
          $size = (Get-Item "dist\CampusGuard-Setup.exe").Length
          Write-Host "CampusGuard-Setup.exe size: $size bytes"
          if ($size -lt 1000000) { throw "Installer is unexpectedly small." }

      - name: Create installer checksum
        shell: pwsh
        run: |
          (Get-FileHash "dist\CampusGuard-Setup.exe" -Algorithm SHA256).Hash | Set-Content checksum.txt

      - name: Publish rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release delete latest --yes 2>$null
          git push origin --delete latest 2>$null
          gh release create latest "dist/CampusGuard-Setup.exe" "version.txt" "checksum.txt" --target "${{ github.sha }}" --title "CampusGuard Latest" --notes "${{ github.run_number }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusGuard-Windows
          path: |
            dist/CampusGuard-Setup.exe
            version.txt
            checksum.txt
